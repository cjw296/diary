[project]
name = "diary-cli"
version = "0.1.0"
description = "Command-line interface for diary"
authors = [
    { name = "Chris Withers", email = "chris@withers.org" }
]
requires-python = ">=3.12"
dependencies = [
    "diary",
    "click>=8.1.7",
]

[tool.uv.sources]
diary = { workspace = true }

[project.scripts]
diary = "diary_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diary_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
